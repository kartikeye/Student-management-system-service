services:
  db:
    image: postgres:16-alpine
    container_name: student_mgmt_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: student_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api-studentMangSys
      dockerfile: Dockerfile
    container_name: student_mgmt_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/student_management?schema=public
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
